[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "videomanager"
version = "0.1.0"
description = "Offline Windows MP4 library manager"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "Send2Trash[nativelib]>=1.8,<3; sys_platform == 'win32'",
]

[project.scripts]
videomanager = "videomanager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"videomanager.db" = ["migrations/*.sql"]
